name: Verify install-warning cleanup

on:
  push:
    branches: ["fix/npm-install-warnings"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          ref: fix/npm-install-warnings

      - name: Set up Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11 for allowScripts support
        run: npm install --global npm@11.21.1

      - name: Regenerate lockfile for the reviewed glob override
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install and verify script policy
        run: |
          npm ci
          npm install-scripts ls

      - name: Verify dependency audit
        run: npm audit

      - name: Run security regression tests
        run: npm run test:security

      - name: Build production PWA
        run: npm run build

      - name: Remove temporary workflow and commit verified metadata
        run: |
          rm .github/workflows/verify-install-warning-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/verify-install-warning-cleanup.yml
          git commit -m "chore: clean dependency install warnings"
          git push origin HEAD:fix/npm-install-warnings

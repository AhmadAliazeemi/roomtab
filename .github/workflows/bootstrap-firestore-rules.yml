name: Bootstrap and test Firestore rules

on:
  push:
    branches: ["fix/firestore-rules-emulator"]

permissions:
  contents: write

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rules-test branch
        uses: actions/checkout@v4
        with:
          ref: fix/firestore-rules-emulator
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate lockfile for rules test dependency
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci
      - name: Check npm audit
        run: npm audit
      - name: Accounting unit tests
        run: npm run test:accounting
      - name: Dependency security tests
        run: npm run test:security
      - name: Firestore Security Rules Emulator tests
        run: npx --yes firebase-tools@15.30.2 emulators:exec --only firestore --project demo-my-mba-room "npm run test:rules"
      - name: Production build
        run: npm run build
      - name: Commit lockfile and remove temporary bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-firestore-rules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/bootstrap-firestore-rules.yml
          git commit -m "chore: lock Firestore rules test dependencies"
          git push origin HEAD:fix/firestore-rules-emulator

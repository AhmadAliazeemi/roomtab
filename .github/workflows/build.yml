name: Build and type-check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "fix/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Test accounting calculations
        run: npm run test:accounting
      - name: Test dependency security backport
        run: npm run test:security
      - name: Test Firestore rules in the emulator
        run: npx --yes firebase-tools@15.30.2 emulators:exec --only firestore --project demo-my-mba-room "npm run test:rules"
      - name: Type-check and build
        run: npm run build

name: Temporary compatible dependency refresh

on:
  push:
    branches: ["fix/dependency-audit-refresh"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/dependency-audit-refresh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compatible security updates (never force a downgrade)
        run: npm audit fix || echo "Some advisories have no compatible automatic fix; inspect the report below."

      - name: Regenerate lockfile for reviewed overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Report remaining audit findings
        if: always()
        run: |
          npm audit --json > /tmp/npm-audit-report.json || true
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("/tmp/npm-audit-report.json", "utf8"));
            console.log("Vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(v => typeof v === "string" ? v : v.title)
              }));
            }
          '

      - name: Verify lockfile install
        run: npm ci

      - name: Test the deepmerge security backport
        run: npm run test:security

      - name: Verify production build
        run: npm run build

      - name: Commit validated dependency update and remove temporary workflow
        run: |
          rm .github/workflows/dependency-audit-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- package.json package-lock.json vendor/deepmerge scripts/test-deepmerge-security.cjs docs/DEPENDENCY-SECURITY.md .github/workflows/dependency-audit-refresh.yml
          if git diff --cached --quiet; then
            echo "No dependency updates to commit."
            exit 0
          fi
          git commit -m "fix: patch transitive dependency security findings"
          git push origin HEAD:fix/dependency-audit-refresh
